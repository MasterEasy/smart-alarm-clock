name: Build Android APK

on:
  push:
    branches: [ main ] 
  pull_request:        
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Clean and install dependencies
      run: |
        rm -rf node_modules
        npm install
        chmod +x node_modules/.bin/*

    - name: Build web app
      run: npm run build

    - name: Capacitor sync
      run: npx cap sync android

    - name: Fix capacitor.build.gradle
      run: |
        sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_1_8/g' android/app/capacitor.build.gradle
        sed -i '/apply from: "\.\.\/capacitor-cordova-android-plugins\/cordova\.variables\.gradle"/d' android/app/capacitor.build.gradle

    - name: Fix settings.gradle
      run: |
        sed -i '/include \':capacitor-cordova-android-plugins\'/d' android/settings.gradle
        sed -i '/project(\':capacitor-cordova-android-plugins\').projectDir = new File(\'\.\/capacitor-cordova-android-plugins\/\')/d' android/settings.gradle

    - name: Fix app/build.gradle
      run: |
        sed -i '/implementation project(\':capacitor-cordova-android-plugins\')/d' android/app/build.gradle

    - name: Build APK
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk