name: Build Android APK

on:
  push:
    branches: [ main ] 
  pull_request:        
    branches: [ main ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Clean and install dependencies
      run: |
        rm -rf node_modules
        npm install
        chmod +x node_modules/.bin/*

    - name: Build web app
      run: npm run build

    - name: Create capacitor-cordova-android-plugins directory
      run: mkdir -p android/capacitor-cordova-android-plugins

    - name: Create cordova.variables.gradle file
      run: echo "// Empty variables file" > android/capacitor-cordova-android-plugins/cordova.variables.gradle

    - name: Download Android SDK
      run: |
        mkdir -p android-sdk/cmdline-tools
        cd android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools latest
        rm cmdline-tools.zip

    - name: Set up Android SDK environment
      run: |
        export ANDROID_HOME=${{ github.workspace }}/android-sdk
        export ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

        echo "sdk.dir=${{ github.workspace }}/android-sdk" > android/local.properties

    - name: Build APK
      env:
        ANDROID_HOME: ${{ github.workspace }}/android-sdk
        ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk