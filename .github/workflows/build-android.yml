name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clean and install dependencies
        run: |
          rm -rf node_modules
          npm install
          chmod +x node_modules/.bin/*

      - name: Build web app
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          npm run build

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Update Gradle and build APK
        run: |
          cd android
          # Update Gradle version
          sed -i 's/gradle-5.6.4-all.zip/gradle-7.6.3-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/5.6.4/7.6.3/g' gradle/wrapper/gradle-wrapper.properties
          
          # Update build.gradle
          sed -i 's/classpath "com.android.tools.build:gradle:4.2.2"/classpath "com.android.tools.build:gradle:7.4.2"/g' build.gradle
          
          # Make gradlew executable
          chmod +x ./gradlew
          
          # Build APK
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk